[project]
name = "ysearch"
version = "0.1.0"
description = "Open-source AI job scout: aggregate, score, draft — you click submit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aryan Naidu" }]
keywords = ["job-search", "ai", "claude", "streamlit", "job-tracker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.58.0",
    "plotly>=6.8.0",
    "beautifulsoup4>=4.14.3",
]

[project.urls]
Homepage = "https://github.com/AryanJ129/ysearch"
Repository = "https://github.com/AryanJ129/ysearch"
Issues = "https://github.com/AryanJ129/ysearch/issues"

[project.scripts]
ysearch = "ysearch.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ysearch"]

# Ship the README inside the package so the Help tab can render it in home
# mode (no clone on disk). The _seed example configs are regular package data.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "ysearch/_seed/README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
